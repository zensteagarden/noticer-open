name: public-verifier-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Runtime
        run: node --version && npm --version
      - name: Release check
        run: npm run check:release
      - name: Guided demo
        run: npm run demo:guided
